# NonLinLoc control file template
# Placeholders ({{RUNBASE}}, {{OBS}}, {{MODEL}}, {{TTIME}}, {{OUTPUT}})
# are substituted by scripts/run_nll_locate.py — do not edit placeholders.

CONTROL 54321 54321
TRANS SIMPLE {{LAT0}} {{LON0}} 0.0 / 111.19 0.0 / 0.0 -111.19

LOCSIG Seismic-workflow skill auto-generated control file

# --- travel-time grid generation is assumed done by wrapper ---
LOCFILES {{OBS}} NLLOC_OBS {{TTIME}}/{{MODEL}} {{OUTPUT}} 00

LOCPHASEID  P   P p GPN
LOCPHASEID  S   S s

LOCSEARCH OCT 10 10 4 0.01 10000.0 6 2

LOCGRID  -50.0 50.0 0.1 -50.0 50.0 0.1 0.0 40.0 0.5 \
         PROB_DENSITY SAVE

LOCPHSTAT  RMS ERH ERZ NREADS GAP

LOCANGLES ANGLES_YES 5

LOCMETH EDT_MLW 9999999.0 4 -1 -1 -1 -7 -3 3 1

LOCGAU 0.1 0.5
LOCPHASEID  P   P p GPN
LOCQUAL2ERR  0.05 0.1 0.5 1.0 99999.9

END_NLLOC
